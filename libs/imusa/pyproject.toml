[project]
name = "imusa"
version = "0.1.0"
description = "Core Machine Learning library for IMUSA Punjabi Meme Sentiment Analysis"
readme = "README.md"
authors = [{ name = "BlackKnight05" }]
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.2.0",
    "pillow>=10.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pydantic-settings>=2.2.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.38.0",
    "scikit-learn>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imusa"]
